info:
  name: /csrf
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/csrf

runtime:
  scripts:
    - type: tests
      code: |-
        // Extrait le jeton de la réponse JSON
        const data = res.body;

        // Sauvegarde le jeton dans une variable d'environnement
        bru.setEnvVar('xsrf_token', data.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
