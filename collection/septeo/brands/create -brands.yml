info:
  name: create /brands
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/brands
  headers:
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  body:
    type: json
    data: |-
      {
        "name": "Tesla",
        "description": "American automobile manufacturer"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
